

name: sr-dpm
use_tb_logger: true
model: recondpm
distortion: sr
gpu_ids: [0]

sde:
  max_sigma: 0.05
  T: 140
  schedule: cosine # linear, cosine
  eps: 0.005


#### Dataset Configuration ####
datasets:
  train:
    name: Train_Dataset
    mode: mridata
    dataroot:  ./data/train # use your own training dataset root
    
    use_shuffle: true
    n_workers: 4  # per GPU
    batch_size: 1
    full_size: 320
    low_size: 40
  

    
  val:
    name: Val_Dataset
    mode: mridata
    dataroot: ./data/val # use your own val dataset root
    


#### # Network Architecture ####
net:
  net_model: GDPM  # DDPM

  dpm_set:
    in_nc: 4
    out_nc: 2
    nf: 64
    depth: 4

  score_set:
    in_nc: 4
  gdpm:
    in_channels: 4
    out_channels: 2
    num_channels: 256
    num_heads: 4
    num_res_blocks: 2
    attention_resolutions: "32,16,8"
    dropout: 0.0
    resamp_with_conv: True
    learn_sigma: false
    use_scale_shift_norm: true
    use_fp16: False
    resblock_updown: true
    num_heads_upsample: -1
    var_type: 'fixedsmall'
    num_head_channels: 64
    image_size: 320
    class_cond: false
    use_new_attention_order: false
    


path:
  pretrain_model:
  # pretrain_model:
  strict_load: true
  resume_state: ~

test:
  is_plus: True
  size:  40

#### Training Setting ####
train:
  optimizer: Adam # Adam, AdamW, Lion
  lr_G: !!float 1e-4
  lr_scheme: MultiStepLR
  beta1: 0.9
  beta2: 0.99
  niter: 1000000
  warmup_iter: -1
  lr_steps: [200000, 400000, 600000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7

  is_weighted: False
  loss_type: l2
  weight: 1.0

  manual_seed: 0
  val_freq: !!float 1e4

  op_loss: sec
  time_small: 140

  need_vel: true

logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 1e4

pc:
  pc_step: 4
  pc_snr : 0.01